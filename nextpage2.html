<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>She Solo - Share Your Story</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            color: #ff4f81;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff4f81;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff2e6a;
        }

        .success-message {
            display: none;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Share Your Solo Story 🌍</h2>
    
    <form id="storyForm">
        <input type="text" placeholder="Your Name" required>
        <input type="text" placeholder="Destination" required>
        <textarea placeholder="Write your solo travel experience..." required></textarea>
        <button type="submit">Submit Story</button>
    </form>

    <div class="success-message" id="successMessage">
        💖 Thank you for sharing your story with She Solo!
    </div>
</div>

<script>
    const form = document.getElementById('storyForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', function(event) {
        event.preventDefault();
        form.style.display = "none";
        successMessage.style.display = "block";
    });
</script>

</body>
</html>
